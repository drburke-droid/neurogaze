<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BVD Video</title>
  <meta name="description" content="The binocular vision dysfunction (BVD) video, played from its script for recording.">
  <meta name="author" content="Dr Robert Burke">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="modulepreload" href="vendor/three/three.module.min.js">
  <link rel="preload" href="head_eyes_v2.glb" as="fetch" crossorigin>
  <link rel="preload" href="vendor/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="story.css">
  <script>if (new URLSearchParams(location.search).get('format') === '9x16') document.documentElement.classList.add('vertical');</script>
  <style>
    /* A fixed-size frame for recording: 1280×720 (16:9) or 720×1280 (9:16), shown at 1.5× for 1080p */
    html, body { margin: 0; background: #0b0d12; overflow: hidden; }
    .demo { display: block; margin: 0; }
    .stage { width: 1280px; height: 720px; max-height: none; aspect-ratio: auto; border-radius: 0; }
    .vertical .stage { width: 720px; height: 1280px; }
    .nav, .legend, .story-nav, .callout, .credit, .input-chip { display: none !important; }
    .story { font-size: 31px; line-height: 1.32; padding: 28px 70px 70px; }
    .story.empty { display: none; }
    .text-mode .story { font-size: 29px; line-height: 1.34; }
    .text-mode .stage.inside-wide .story { font-size: 30px; width: 500px; padding-right: 36px; } /* a wider column for the full narration */
    .paddle { transition-duration: .9s; } /* a calmer glide from eye to eye */
    .nv-label { font-size: 19px; padding: 5px 14px; } /* labels in the nerve drawing, readable on a phone */
    .stage.inside-wide .story { font-size: 32px; padding: 40px 56px 40px 48px; }
    .vertical .story { font-size: 36px; padding: 48px 44px 90px; }

    /* Overlays drawn over the story: the eye chart, the title and the end card */
    .ov { position: absolute; z-index: 9; pointer-events: none; opacity: 0; }
    .chart { left: 64px; top: 50%; width: 230px; padding: 22px 18px 18px; background: #fbfbf7; border-radius: 14px; box-shadow: 0 18px 40px rgba(0, 0, 0, .5); text-align: center; color: #111; font-family: Georgia, "Times New Roman", serif; }
    .chart div { letter-spacing: .18em; line-height: 1.15; }
    .chart .ok { margin-top: 14px; font: 800 26px var(--head); color: #0f8a4a; letter-spacing: 0; }
    .chart .ok + .ok { margin-top: 4px; font-size: 20px; }
    .title { inset: 0; display: grid; place-content: center; text-align: center; color: #fff; background: radial-gradient(ellipse at 50% 55%, rgba(8, 11, 16, .55), rgba(8, 11, 16, .88)); }
    .title h1 { margin: 0; font: 700 62px/1.1 var(--head); letter-spacing: -.01em; text-shadow: 0 4px 18px rgba(0, 0, 0, .6); }
    .title h1 span { color: #ffcf5a; }
    .title p { margin: 18px auto 0; max-width: 900px; font: 600 28px/1.35 var(--body); color: rgba(255, 255, 255, .88); }
    .end { inset: 0; display: grid; align-content: center; justify-items: start; padding: 0 0 0 90px; color: #fff; background: linear-gradient(90deg, rgba(8, 11, 16, .97) 0%, rgba(8, 11, 16, .9) 55%, rgba(8, 11, 16, .6) 100%); }
    .end h2 { font: 700 46px/1.15 var(--head); max-width: 640px; }
    .end p { margin: 16px 0 0; font: 600 26px var(--body); color: rgba(255, 255, 255, .85); max-width: 640px; }
    .end .url { margin-top: 30px; display: inline-block; font: 700 34px var(--head); color: #1b2230; background: #ffcf5a; padding: 12px 26px; border-radius: 14px; }
    .end small { display: block; margin-top: 22px; font: 600 20px var(--body); color: rgba(255, 255, 255, .6); }
    .vertical .end { padding: 0 60px; align-content: center; background: rgba(8, 11, 16, .93); }

    /* Preview: press play to watch in real time */
    .play { position: fixed; left: 16px; top: 16px; z-index: 20; font: 700 18px var(--body); padding: 10px 18px; border-radius: 99px; border: 0; background: #ffcf5a; color: #1b2230; cursor: pointer; }
    .play[hidden] { display: none; }
  </style>
</head>
<body data-page="video">
  <div class="demo" id="demo"></div>
  <button class="play" id="play" type="button" hidden>Play</button>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <script type="module" src="./neurolens.js"></script>
  <script type="module" src="./video.js"></script>
</body>
</html>
